[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "TraderResearch"
version = "0.1.0"
description = "Research social-market signals and execute paper trades safely."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "TraderResearch contributors", email = "example@example.com" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "platformdirs>=4.2,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0.2,<7",
  "SQLAlchemy>=2.0.32,<3",
]

[project.optional-dependencies]
ibkr = ["ibapi>=9.81.1.post1"]
dev = [
  "mypy>=1.11,<2",
  "pip-audit>=2.10.1,<3",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<10",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
traderresearch = "traderresearch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traderresearch = ["data/*.json", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["traderresearch"]
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["ibapi", "ibapi.*"]
ignore_missing_imports = true
