name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709
        run: |
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --show-error --silent \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" gitleaks
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"

      - name: Verify the detector rejects a synthetic secret
        run: |
          fixture_dir="$(mktemp -d)"
          fixture_report="${RUNNER_TEMP}/gitleaks-regression.json"
          fixture_name="api""_key"
          fixture_value="b8f2A7xQ9mK4pL6v""N3cR5tY1uW0zD2eH"
          printf '%s = %s\n' "$fixture_name" "$fixture_value" > "$fixture_dir/fixture.env"
          if gitleaks dir --config .gitleaks.toml --redact \
            --report-format json --report-path "$fixture_report" "$fixture_dir"; then
            echo "::error::gitleaks failed to detect the regression fixture"
            exit 1
          fi
          if [ "$(jq 'length' "$fixture_report")" -lt 1 ]; then
            echo "::error::gitleaks failed before recording a secret finding"
            exit 1
          fi

      - name: Scan complete Git history
        run: gitleaks git --config .gitleaks.toml --log-opts='--all' --redact --verbose .

      - name: Scan working tree
        run: gitleaks dir --config .gitleaks.toml --redact --verbose .
